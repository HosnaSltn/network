<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Counting People Monitor</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, sans-serif;
        text-align: center;
        background: #1a1a1a;
        color: white;
        transition: direction 0.3s;
      }
      #container {
        width: 95%;
        max-width: 600px;
        margin: auto;
        padding: 20px;
        box-sizing: border-box;
      }

      .lang-switcher {
        margin-bottom: 20px;
        text-align: right;
      }
      select {
        padding: 5px;
        border-radius: 5px;
        background: #333;
        color: white;
        border: 1px solid #555;
      }

      .stats-container {
        display: flex;
        justify-content: space-around;
        background: #333;
        padding: 15px;
        border-radius: 10px;
        margin-top: 15px;
      }
      .stat-box {
        font-size: 16px;
      }
      .stat-number {
        display: block;
        font-size: 32px;
        font-weight: bold;
        color: #00ff88;
      }

      canvas {
        width: 100%;
        border: 2px solid #444;
        border-radius: 8px;
      }
      video {
        display: none;
      }

      body[dir="rtl"] .lang-switcher {
        text-align: left;
      }

      #status:not(:empty) {
        color: #ffc794;
      }
    </style>
  </head>
  <body dir="ltr" id="mainBody">
    <div id="container">
      <div class="lang-switcher">
        <select id="langSelect" aria-label="Language" onchange="changeLanguage(this.value)">
          <option value="en">English</option>
          <option value="fa">فارسی (Persian)</option>
          <option value="ar">العربية (Arabic)</option>
        </select>
      </div>

      <h2 id="titleText">Counting People Monitor</h2>
      <p id="status" role="status"></p>

      <canvas id="displayCanvas"></canvas>
      <video id="video" autoplay muted playsinline></video>

      <div class="stats-container">
        <div class="stat-box">
          <span id="lblIn">INCOMING</span>
          <span id="in" class="stat-number">0</span>
        </div>
        <div class="stat-box">
          <span id="lblOut">OUTGOING</span>
          <span id="out" class="stat-number">0</span>
        </div>
        <div class="stat-box">
          <span id="lblCurr">ON-SCREEN</span>
          <span id="current" class="stat-number">0</span>
        </div>
      </div>
    </div>

    <script>
      const translations = {
        en: {
          title: "Counting People Monitor",
          in: "INCOMING",
          out: "OUTGOING",
          curr: "ON-SCREEN",
          dir: "ltr",
          cameraError: "Camera unavailable. Check browser permissions and camera settings.",
          connectionError: "The counting server is disconnected. Reload to reconnect.",
          frameError: "The server could not read the camera frame.",
        },
        fa: {
          title: "مانیتورینگ شمارش افراد",
          in: "ورودی",
          out: "خروجی",
          curr: "افراد حاضر",
          dir: "rtl",
          cameraError: "دوربین در دسترس نیست. مجوز مرورگر و تنظیمات دوربین را بررسی کنید.",
          connectionError: "ارتباط با سرور شمارش قطع شد. صفحه را دوباره بارگذاری کنید.",
          frameError: "سرور نتوانست تصویر دوربین را بخواند.",
        },
        ar: {
          title: "مراقبة عد الأشخاص",
          in: "دخول",
          out: "خروج",
          curr: "الموجودون",
          dir: "rtl",
          cameraError: "الكاميرا غير متاحة. تحقق من أذونات المتصفح وإعدادات الكاميرا.",
          connectionError: "انقطع الاتصال بخادم العد. أعد تحميل الصفحة للاتصال مجددًا.",
          frameError: "تعذر على الخادم قراءة صورة الكاميرا.",
        },
      };

      let language = "en";
      let statusKey = "";

      function setStatus(key) {
        statusKey = key;
        document.getElementById("status").textContent = translations[language][key] || "";
      }

      function changeLanguage(lang) {
        language = lang;
        const t = translations[lang];

        document.getElementById("titleText").innerText = t.title;
        document.getElementById("lblIn").innerText = t.in;
        document.getElementById("lblOut").innerText = t.out;
        document.getElementById("lblCurr").innerText = t.curr;

        document.documentElement.lang = lang;
        document.getElementById("mainBody").setAttribute("dir", t.dir);
        setStatus(statusKey);
      }

      const video = document.getElementById("video");
      const canvas = document.getElementById("displayCanvas");
      const context = canvas.getContext("2d");
      const scheme = window.location.protocol === "https:" ? "wss:" : "ws:";
      const socket = new WebSocket(`${scheme}//${window.location.host}/ws/video/`);
      const sendInterval = 1000 / 3;

      let latestBoxes = [];
      let lastSentAt = -Infinity;
      let awaitingResult = false;

      async function startCamera() {
        try {
          video.srcObject = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment" },
          });
          await video.play();
          requestAnimationFrame(processFrame);
        } catch {
          setStatus("cameraError");
        }
      }

      function processFrame(timestamp) {
        requestAnimationFrame(processFrame);
        if (video.readyState < video.HAVE_CURRENT_DATA) return;

        const width = 400;
        const height = Math.round(width * video.videoHeight / video.videoWidth);
        if (canvas.width !== width || canvas.height !== height) {
          canvas.width = width;
          canvas.height = height;
          latestBoxes = [];
        }
        context.drawImage(video, 0, 0, canvas.width, canvas.height);

        if (socket.readyState === WebSocket.OPEN && !awaitingResult && timestamp - lastSentAt >= sendInterval) {
          const image = canvas.toDataURL("image/jpeg", 0.4);
          socket.send(JSON.stringify({ image }));
          awaitingResult = true;
          lastSentAt = timestamp;
        }

        context.strokeStyle = "#ff3300";
        context.lineWidth = 4;
        context.beginPath();
        context.moveTo(canvas.width / 2, 0);
        context.lineTo(canvas.width / 2, canvas.height);
        context.stroke();

        context.strokeStyle = "#00ff88";
        context.lineWidth = 2;
        latestBoxes.forEach((box) => {
          context.strokeRect(box.x, box.y, box.w, box.h);
        });

      }

      socket.onmessage = (e) => {
        awaitingResult = false;
        const data = JSON.parse(e.data);
        if (data.error) {
          setStatus("frameError");
          return;
        }
        if (statusKey === "frameError") setStatus("");
        document.getElementById("in").innerText = data.entry;
        document.getElementById("out").innerText = data.exit;
        document.getElementById("current").innerText = data.current_people;
        latestBoxes = data.boxes;
      };
      socket.onclose = () => setStatus("connectionError");

      startCamera();
    </script>
  </body>
</html>
